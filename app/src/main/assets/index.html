<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FR4NX VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background-color: #080610; background-image: radial-gradient(circle at top right, #1f0d33 0%, #080610 50%); color: white; height: 100vh; overflow-y: auto; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 25px; }
        .logo { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #b78aff, 0 0 30px #b78aff; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .badge { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(183, 138, 255, 0.3); padding: 4px 10px; border-radius: 8px; font-size: 10px; color: #00ffcc; font-weight: bold; letter-spacing: 1px; }

        .section-title { font-size: 11px; color: #b78aff; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
        
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .toggle-row:last-child { border-bottom: none; }
        .toggle-row span { font-size: 15px; font-weight: 600; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #33204d; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #d8b4fe; transition: .4s; border-radius: 50%; box-shadow: 0 0 8px #b78aff; }
        input:checked + .slider { background-color: #9333ea; }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 14px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; transition: 0.2s; text-align: center; letter-spacing: 1px; }
        .btn-glow { background: linear-gradient(90deg, #5b21b6, #9333ea, #5b21b6); background-size: 200% auto; border: 1px solid #d8b4fe; box-shadow: 0 0 15px rgba(147, 51, 234, 0.5); font-size: 16px; margin-top: 30px; animation: shine 3s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .btn-glow:active { transform: scale(0.98); }
        .btn-glow:disabled { background: #2a1f3d; border-color: #554477; color: #8875aa; box-shadow: none; animation: none; }

        .status { text-align: center; font-size: 11px; color: #8875aa; margin-top: 10px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">FR4NX VIP</div>
        <div class="badge">v4.2 PRO</div>
    </div>

    <div class="section-title">MEMORY INJECTION</div>
    <div class="card">
        <div class="toggle-row" onclick="Android.grantOverlay()">
            <span>Auto-Headshot (Aimbot)</span>
            <label class="switch">
                <input type="checkbox" id="aimbotToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="toggle-row" onclick="Android.grantAccessibility()">
            <span>Wallhack (ESP)</span>
            <label class="switch">
                <input type="checkbox" id="espToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span>No Recoil / No Spread</span>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <button class="btn btn-glow" id="btn-activate" onclick="startInjection()">ACTIVATE HACK</button>
    <div class="status" id="status">READY TO INJECT</div>

    <script>
        // When the page loads, we can't easily check permissions from JS.
        // But when the user taps a toggle, it fires the Java method which opens settings.
        
        let isInjecting = false;
        function startInjection() {
            if (isInjecting) return;
            
            // The Java backend checks if permissions are actually granted.
            // If not, it does nothing (or shows a toast in Java).
            // For the UI, we just simulate.
            isInjecting = true;
            const btn = document.getElementById("btn-activate");
            const status = document.getElementById("status");

            btn.disabled = true;
            btn.innerText = "INJECTING...";
            status.innerText = "DO NOT CLOSE APP";

            // Wait 2.5 seconds to simulate injection, then trigger Java
            setTimeout(() => {
                status.innerText = "INJECTION SUCCESSFUL";
                Android.activateHack();
            }, 2500);
        }
    </script>
</body>
</html>
