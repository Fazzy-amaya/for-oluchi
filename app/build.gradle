plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fr4nx.vplinkbypasser'
    compileSdk 33

    defaultConfig {
        applicationId "com.fr4nx.vplinkbypasser"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
